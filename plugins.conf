# Plugins this deployment installs, one git URL per line.
#
# dsh-ops does not carry plugin code: every entry below is cloned into
# plugins/ (git-ignored, like harness/upstream and harness/builds) and mounted
# from there, so the repos stay the source of truth. gitignored means the
# plugins survive a pull of this checkout and cannot be committed by accident.
#
#   URL              clone the default branch
#   URL REF          check out REF (a tag or branch) instead
#
# A plugin can live on this machine instead of a remote: put such entries in
# plugins.local.conf (git-ignored, same format) rather than here, so a machine
# path never becomes part of this repo.
#
# Settings -> Updates in the GUI shows what is installed and updates it; the
# same work is available as `bin/dsh-plugins.sh --check` / `--update`.
#
# Keep lines sorted; the directory name is the repository name.
https://github.com/Fruffel/dsh-llm-llamacpp.git
https://github.com/Fruffel/dsh-ops-updater.git
