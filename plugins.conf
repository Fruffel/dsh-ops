# The one plugin dsh-ops itself names: the updater, which is what gives a fresh
# clone a way to install and update everything else from the GUI.
#
# This file is TRACKED, so treat it as part of the product. Plugin code never
# belongs in this repository, and neither do the plugins a deployment happens to
# run: put those in plugins.local.conf (git-ignored, same format), which is what
# every machine but a bare clone will use.
#
#   URL              clone the default branch
#   URL REF          check out REF (a tag or branch) instead
#
# Both files are read by bin/dsh-plugins.sh, which clones each entry into
# plugins/ (git-ignored, like harness/upstream and harness/builds) and is what
# bin/dsh-install-assets.sh mounts. Settings -> Updates in the GUI checks and
# updates whatever is installed.
https://github.com/Fruffel/dsh-ops-updater.git
