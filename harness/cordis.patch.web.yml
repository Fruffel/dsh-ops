# dsh-ops:managed — dsh-ops owns this file and replaces it in place (keeping a
# .bak) while this marker line is present. Delete the marker to take ownership.
#
# Web profile user layer for dsh-ops, installed at
# ~/.dsh/profiles/web/cordis.patch.yml. The loader applies it after every
# bundle layer of the `web` profile, and the profile live-reloads it on edit.
#
# Read the design notes in the repo README before changing these rows.

# 1. Bind every interface.
#    The CLI refuses `--host 0.0.0.0` ("binding all network interfaces is not
#    supported"), but the Web runtime itself supports an all-interfaces bind:
#    resolveLanTrust samples every non-internal IPv4 literal once at boot and
#    adds them to the /api fence, and the printed URL line gains a "(LAN: ...)"
#    address. Declaring it here is what makes any address the host answers on —
#    tailnet IPv4, MagicDNS name, LAN IP — work without maintaining a list, and
#    it survives a tailnet address change with no restart.
#    A patch replaces the targeted row's WHOLE config, so every key the row
#    owns is restated. `--host` no longer decides anything while this row is
#    here; drop the row to go back to the bundle's loopback default.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  inject: [webStartup]
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

# 2. The /api browser-trust fence and the browser cookie lifetime.
#    A patch replaces the targeted row's WHOLE config, so `trustedHosts` is
#    restated with the bundle's own expression (bind-derived authorities plus
#    every --trusted-host of this invocation). Omitting it would fall back to
#    the schema default [] and refuse every tailnet request with 403.
- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    cookieMaxAgeDays: 365

# 3. The modules node half registers its /plugins route on the webserver, and
#    when that service is already active it reads it through a bare
#    `ctx.webServer` property access — one that resolves only when webServer sits
#    on the reading fiber. Declaring the dependency is what the code means: the
#    fiber waits for the server and the read is legal. Without it a boot fails
#    with 'cannot get property "webServer" without inject' often enough to
#    matter (1 in 8 measured here) and systemd restarts the service.
#    Drop this row when upstream declares the injection itself.
- id: modules
  name: '@deepseek-ai/dsh-client-modules'
  inject: [webServer]

# 4. The operator-surface plugin: pages served on a fence-trusted authority
#    declare themselves the operator's own surface, so host-backed settings
#    (Models, API keys, appearance) work over the tailnet instead of degrading
#    to process-local memory. The plugin reads its authorities from the live
#    webRuntime service; `./` is resolved relative to this patch file.
#    It lives in its own package (name + version) rather than as a loose file
#    next to the profile's package.json: official DeepSeek requests inventory
#    every active Loader plugin, and a relative module whose nearest named
#    manifest has no version fails the request with REQUEST_EXTENSION.
- insert:
    - id: dsh-ops-operator-surface
      name: ./dsh-ops-operator-surface/index.mjs

# The updater: Settings -> Updates. The package behind it is its own repository,
# cloned into plugins/ (see the README); this row and the script it calls are all
# dsh-ops carries for it, and the install script warns when the package is
# missing rather than letting the boot fail on an unresolvable row.
#
#    Its Host half runs bin/dsh-sync.sh --check --json to answer "is there
#    something newer?" and starts dsh-update.service to install it; its Client
#    half is the page that asks. The page reaches the Host half through ONE
#    exact /api route
#    (ctx.connection.fetch.register): the request is then served by the same
#    Host/Origin fence and browser cookie as every other /api call, so a page
#    that is not an authenticated page of this harness gets 401 and never
#    reaches the updater. A bare webserver route would have had neither fence.
#
#    It discovers this checkout itself (the service's WorkingDirectory is
#    <ops>/harness/current, and dsh-web.service names that path), so this row
#    stays machine-independent. Add `config: { opsPath: /path/to/dsh-ops }` only
#    if a deployment starts the harness in a way discovery cannot follow.
#
#    Update mode is a choice, not a default: DSH_AUTO_UPDATE in dsh-ops.conf
#    decides whether dsh-update.timer runs nightly, and the Updates page toggles
#    that same setting. Either way the work happens in dsh-update.service, whose
#    own cgroup is what lets an update survive the restart it performs.
- insert:
    - id: dsh-ops-updater
      name: ./dsh-ops-updater/index.mjs

